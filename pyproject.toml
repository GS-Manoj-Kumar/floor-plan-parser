[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fpvec"
version = "0.3.0"
description = "Raster floor plan to vector: walls (with thickness), doors (hinge + swing) and windows."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "opencv-python-headless>=4.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
api = ["fastapi>=0.100", "uvicorn>=0.22", "python-multipart>=0.0.6"]
pdf = ["pypdfium2>=4.20"]
ocr = ["rapidocr-onnxruntime>=1.2"]
all = ["fastapi>=0.100", "uvicorn>=0.22", "python-multipart>=0.0.6", "pypdfium2>=4.20", "rapidocr-onnxruntime>=1.2"]

[project.scripts]
fpvec = "fpvec.cli:main"
fpvec-demo = "fpvec.api:main"

[tool.setuptools]
packages = ["fpvec"]

[tool.setuptools.package-data]
fpvec = ["web/*.html"]
