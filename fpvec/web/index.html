<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fpvec · plan tracer</title>
<style>
/* Layout: steps across the top, the current step's tools under them, the
   drawing in the middle and the step's settings on the right. */
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#f8f9fb;--ink:#1d2129;--muted:#626b78;--line:#d8dce3;
  --accent:#2563eb;--accent-ink:#ffffff;--accent-soft:#e6eefc;
  --wall:#e03131;--door:#f0a800;--window:#1c7ed6;--opening:#2f9e44;--hint:#0ca678;--sel:#7048e8;
  --canvas:#e6e8ec;--warn:#e8590c;--r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121417;--panel:#1b1e23;--panel2:#20242a;--ink:#e7e9ed;--muted:#9aa2ae;--line:#30353d;
    --accent:#4c8dff;--accent-ink:#ffffff;--accent-soft:#1f2c45;--canvas:#0d0f12;--door:#ffc021;--window:#4dabf7;--wall:#ff6b6b;--opening:#51cf66;--hint:#38d9a9;--sel:#9775fa;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121417;--panel:#1b1e23;--panel2:#20242a;--ink:#e7e9ed;--muted:#9aa2ae;--line:#30353d;
  --accent:#4c8dff;--accent-ink:#ffffff;--accent-soft:#1f2c45;--canvas:#0d0f12;--door:#ffc021;--window:#4dabf7;--wall:#ff6b6b;--opening:#51cf66;--hint:#38d9a9;--sel:#9775fa;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
.steps{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.step{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:none;border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;color:var(--muted)}
.step .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600}
.step.done{color:var(--ink)}.step.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.step.cur{background:var(--accent);color:var(--accent-ink)}.step.cur .n{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.step:disabled{opacity:.45;cursor:default}
.status{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44ch}
.status.err{color:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:46px}
.bar .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.bar .sp{flex:1}
.vr{width:1px;height:24px;background:var(--line);margin:0 2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.step:focus-visible,.preset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:var(--r) 0 0 var(--r);margin-left:0}
.seg .btn:last-child{border-radius:0 var(--r) var(--r) 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
#view{position:relative;background:var(--canvas);overflow:hidden;min-height:320px}
#cv{display:block;width:100%;height:100%;touch-action:none}
#drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none;padding:16px}
#drop b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
#hint{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:12.5px;max-width:calc(100% - 24px);pointer-events:none}
#hint:empty{display:none}
#legend{position:absolute;right:12px;top:12px;display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;font-size:12px}
#legend span{display:inline-flex;align-items:center;gap:5px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pane{flex:1;overflow:auto;padding:14px 16px}
.pane h2{font-size:15px;margin:0 0 4px}
.pane p.lead{margin:0 0 12px;color:var(--muted);font-size:13px}
.pane h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.field{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:8px 0}
.field .k{font-size:13px}
.field .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;text-align:right;min-width:3.5em}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.field .help{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.field .wide{grid-column:1/-1}
input[type=number],input[type=text],select{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:5px 7px}
input[type=number]{width:96px}
.presets{display:grid;gap:6px}
.preset{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 10px;cursor:pointer}
.preset b{display:block;font-size:13px}
.preset span{font-size:12px;color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.w b{color:var(--wall)}.stat.d b{color:var(--door)}.stat.o b{color:var(--window)}.stat.p b{color:var(--opening)}
.note{font-size:12.5px;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--panel2)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
tbody tr{cursor:pointer}
tbody tr.sel td{background:var(--accent-soft)}
.foot{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.foot .btn{flex:1;justify-content:center}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dl .btn{flex-direction:column;align-items:flex-start;gap:0;white-space:normal}
.dl .btn small{color:var(--muted);font-size:11px}
.dl .btn.primary small{color:inherit;opacity:.85}
.kbd{font:11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 4px;background:var(--panel2)}
.bar .brk{flex-basis:100%;height:0}
.slider{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.slider input{width:130px;accent-color:var(--accent)}
.slider .v{min-width:2.2em;color:var(--muted);font-variant-numeric:tabular-nums}
.sticky{position:sticky;top:-14px;margin:-14px -16px 12px;padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
.sticky h3{margin-top:4px}
.choices{display:grid;gap:6px}
.choices .btn{justify-content:flex-start}
.ulist{display:grid;gap:4px;margin-top:6px}
.ulist .it{display:flex;align-items:center;gap:6px}
.ulist .it .preset{flex:1;min-width:0}
#edwrap{position:absolute;inset:0;background:var(--panel)}
#edwrap iframe{width:100%;height:100%;border:0;display:block}
#edwrap .msg{padding:24px;max-width:60ch}
main.full{grid-template-columns:1fr}
main.full aside{display:none}
[hidden]{display:none!important}
@media (max-width:900px){body{display:block}main{grid-template-columns:1fr;grid-template-rows:62vh auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">fpvec <small>plan tracer</small></div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <div class="status" id="status" role="status"></div>
</div>
<div class="bar" id="bar"></div>
<main>
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="drop"><div><b>Open a floor plan image or PDF</b>Drop it here, or use Open in the toolbar · wheel zooms · right-drag pans</div></div>
    <div id="legend" hidden><span><i class="sw" style="background:var(--wall)"></i>walls</span><span><i class="sw" style="background:var(--door)"></i>doors</span><span><i class="sw" style="background:var(--window)"></i>windows</span><span><i class="sw" style="background:var(--opening)"></i>openings</span></div>
    <div id="hint"></div>
    <div id="edwrap" hidden></div>
  </div>
  <aside>
    <div class="pane" id="pane"></div>
    <div class="foot"><button class="btn" id="bBack">Back</button><button class="btn primary" id="bNext">Next</button></div>
  </aside>
</main>
<input id="file" type="file" accept="image/*,application/pdf,.pdf" hidden>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var cv=$('#cv'),ctx=cv.getContext('2d'),view={s:1,ox:0,oy:0};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function dpr(){return window.devicePixelRatio||1;}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ======================================================= state */
var STEPS=[['open','Open'],['correct','Correct'],['scale','Scale'],['prepare','Prepare'],['detect','Detect'],['edit','Edit'],['plan','Floor plan']];
var S={step:'open',file:null,token:null,kind:'image',page:1,pages:1,photo:'auto',rect:null,
  base:null,prepImg:null,resImg:null,shown:null,
  prep:{grayscale:true,black:110,white:210,binary:false,lines:0,masks:[]},hints:[],
  preset:'bw',tuning:{},caps:{},presets:null,tuningSpec:null,
  scale:{mode:'auto',wall:200,mmpx:10,dist:'',pts:[]},
  res:null,plan:null,undo:[],redo:[],sel:null,tool:'pan',mmode:'white',size:40,blur:12,
  cur:null,mouse:null,orig:false,lenbuf:'',showImg:true};
var IMGW=0,IMGH=0;

function setStatus(t,err){var s=$('#status');s.textContent=t||'';s.title=t||'';s.className='status'+(err?' err':'');}
function hint(t){$('#hint').textContent=t||'';}
function api(path,fd){return fetch(path,{method:'POST',body:fd}).then(function(r){if(!r.ok)return r.json().catch(function(){return {};}).then(function(j){throw new Error(j.detail||r.statusText);});return r.json();});}
function loadImg(url){return new Promise(function(ok,bad){var im=new Image();im.onload=function(){ok(im);};im.onerror=bad;im.src=url;});}
function mmpx(){
  if(S.plan&&S.plan.mm_per_px)return S.plan.mm_per_px;
  if(S.scale.mode==='mmpx'&&+S.scale.mmpx>0)return +S.scale.mmpx;
  if(S.scale.mode==='pts'){var k=ptsScale();if(k)return k;}
  return null;}
function fmtLen(px){var k=mmpx();return k?Math.round(px*k)+' mm':Math.round(px)+' px';}

/* ======================================================= steps + navigation */
function stepIdx(id){for(var i=0;i<STEPS.length;i++)if(STEPS[i][0]===id)return i;return -1;}
function reachable(id){if(id==='open')return true;if(id==='plan')return !!(S.caps.editor||S.plan);if(!S.token)return false;if(id==='edit')return !!S.plan;return true;}
function renderSteps(){
  var nav=$('#steps'),curI=stepIdx(S.step);nav.innerHTML='';
  STEPS.forEach(function(st,i){var b=document.createElement('button');b.type='button';b.className='step'+(i<curI&&reachable(st[0])?' done':'')+(st[0]===S.step?' cur':'');
    b.innerHTML='<span class="n">'+(i+1)+'</span>'+st[1];b.disabled=!reachable(st[0]);b.onclick=function(){go(st[0]);};nav.appendChild(b);});
  $('#bBack').disabled=curI===0;
  var nx=STEPS[curI+1];
  $('#bNext').textContent=S.step==='detect'&&!S.plan?'Detect':S.step==='edit'?'Next: floor plan':'Next';
  $('#bNext').disabled=S.step!=='detect'&&nx&&!reachable(nx[0]);}
function go(id){S.step=id;S.cur=null;S.lenbuf='';
  var tools={prepare:['pan','brush','rect','poly','mark'],edit:['select','wall','door','window','opening'],scale:['pan','pick']}[id]||['pan'];
  if(tools.indexOf(S.tool)<0)S.tool=tools[0];
  var full=id==='plan';$('main').classList.toggle('full',full);$('#edwrap').hidden=!full;
  if(full)openEditor();else resize();
  hint('');renderSteps();renderBar();renderPane();draw();}
$('#bBack').onclick=function(){var i=stepIdx(S.step);if(i>0)go(STEPS[i-1][0]);};
$('#bNext').onclick=function(){if(S.step==='detect'&&!S.plan){detect();return;}
  var i=stepIdx(S.step);if(i<STEPS.length-1&&reachable(STEPS[i+1][0]))go(STEPS[i+1][0]);};

/* ======================================================= toolbar */
function tb(html){$('#bar').innerHTML=html;}
function segHTML(name,items,cur){return '<span class="seg" role="group">'+items.map(function(it){return '<button type="button" class="btn" data-'+name+'="'+it[0]+'" aria-pressed="'+(it[0]===cur)+'"'+(it[2]?' title="'+esc(it[2])+'"':'')+'>'+it[1]+'</button>';}).join('')+'</span>';}
function bindSeg(name,fn){document.querySelectorAll('[data-'+name+']').forEach(function(b){b.onclick=function(){fn(b.getAttribute('data-'+name));};});}
function renderBar(){
  var st=S.step;
  if(st==='open'){tb('<span class="lbl">Open</span><button class="btn primary" id="tOpen">Open image or PDF…</button><select id="tEx" aria-label="Examples"><option value="">Examples…</option></select>'+
      (S.kind==='pdf'?'<span class="vr"></span>Page <input id="tPage" type="number" min="1" style="width:64px" value="'+S.page+'"> of '+S.pages:''));
    $('#tOpen').onclick=function(){$('#file').click();};
    fetch('api/examples').then(function(r){return r.json();}).then(function(l){var s=$('#tEx');if(!s)return;l.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});}).catch(function(){});
    $('#tEx').onchange=function(){var n=this.value;if(n)fetch('examples/'+encodeURIComponent(n)).then(function(r){return r.blob();}).then(function(b){openFile(new File([b],n,{type:b.type}));});};
    if($('#tPage'))$('#tPage').onchange=function(){S.page=Math.max(1,Math.min(S.pages,+this.value||1));load(false);};
    return;}
  if(st==='correct'){tb('<span class="lbl">Photo correction</span>'+segHTML('photo',[['auto','Auto','Only when the image looks like a photo of a sheet'],['on','On'],['off','Off']],S.photo)+'<span class="vr"></span><button class="btn" id="tOrig2" title="Hold to compare">Hold: as uploaded</button><span class="sp"></span><span class="note">Removes perspective, evens out the light, straightens the drawing</span>');
    bindSeg('photo',function(v){S.photo=v;load(false);});holdBtn($('#tOrig2'),'upload');return;}
  if(st==='scale'){tb('<span class="lbl">Scale</span>'+segHTML('smode',[['auto','Read from the plan'],['wall','Wall thickness'],['pts','Two points'],['mmpx','mm per pixel']],S.scale.mode)+
      (S.scale.mode==='pts'?'<span class="vr"></span><button class="btn" id="tPick" aria-pressed="'+(S.tool==='pick')+'">Pick 2 points</button>':''));
    bindSeg('smode',function(v){S.scale.mode=v;S.tool=v==='pts'&&S.scale.pts.length<2?'pick':'pan';if(S.tool==='pick')hint('Click the first point of a known distance');renderBar();renderPane();draw();});
    if($('#tPick'))$('#tPick').onclick=function(){S.tool='pick';S.scale.pts=[];renderBar();renderPane();hint('Click the first point of a known distance');draw();};
    return;}
  if(st==='prepare'){
    var P=S.prep;
    tb('<span class="lbl">Image</span>'+tgl('pGray','Black & white',P.grayscale)+tgl('pBin','Pure black / white',P.binary)+
      slider('pBlack','Darken lines',0,250,P.black,'Grey at or below this becomes black')+
      slider('pWhite','Whiten background',0,250,255-P.white,'Grey at or above 255 minus this becomes white: removes floors, textures, shading')+
      slider('pLines','Boost thin lines',0,100,P.lines,'Darkens only thin strokes: door arcs, window glazing')+
      '<button class="btn" id="tOrig" title="Hold to compare">Hold: before</button>'+
      '<span class="brk"></span><span class="lbl">Tool</span>'+segHTML('tool',[['pan','Pan','Move the drawing (V)'],['brush','Brush','Paint over what is not needed (B)'],['rect','Rectangle','Drag a box around what is not needed (R)'],['poly','Polygon','Click the corners of an area (P)'],['mark','Mark walls','Draw along walls: they get special attention (W)']],S.tool)+
      '<span class="vr"></span>'+(S.tool==='mark'?'<span class="note">Click points · Shift = any angle · type a length + Enter · double-click / Enter ends</span>':
      '<span class="lbl">Area</span>'+segHTML('mmode',[['white','Remove','Painted white: ignored completely'],['blur','Blur','Fine detail fades out']],S.mmode)+
      slider('pSize','Brush',4,300,S.size,'Brush size in image pixels')+(S.mmode==='blur'?slider('pBlur','Blur',2,40,S.blur,'Blur strength'):''))+
      '<span class="sp"></span><button class="btn" id="tUndo" title="Ctrl+Z">Undo</button><button class="btn" id="tClear">Clear areas &amp; marks</button>');
    bindSeg('tool',setTool);bindSeg('mmode',function(v){S.mmode=v;renderBar();});
    $('#tUndo').onclick=undoPrep;$('#tClear').onclick=function(){S.prep.masks=[];S.hints=[];S.cur=null;prepChanged();};
    $('#pGray').onclick=function(){P.grayscale=!P.grayscale;this.setAttribute('aria-pressed',P.grayscale);custom();prepChanged(true);};
    $('#pBin').onclick=function(){P.binary=!P.binary;this.setAttribute('aria-pressed',P.binary);custom();prepChanged(true);};
    [['pBlack','black',function(v){return v;}],['pLines','lines',function(v){return v;}],['pWhite','white',function(v){return 255-v;}]].forEach(function(a){
      $('#'+a[0]).oninput=function(){P[a[1]]=a[2](+this.value);if(P.white<=P.black)P.white=Math.min(255,P.black+1);$('#v_'+a[0]).textContent=this.value;custom();prepChanged(true);};});
    if($('#pSize'))$('#pSize').oninput=function(){S.size=+this.value;$('#v_pSize').textContent=this.value;draw();};
    if($('#pBlur'))$('#pBlur').oninput=function(){S.blur=+this.value;$('#v_pBlur').textContent=this.value;};
    holdBtn($('#tOrig'),'base');return;}
  if(st==='detect'){tb('<span class="lbl">Detect</span><button class="btn primary" id="tDet">'+(S.plan?'Detect again':'Detect walls, doors and windows')+'</button><span class="sp"></span><span class="note">Detecting again replaces your edits</span>');
    $('#tDet').onclick=detect;return;}
  if(st==='edit'){tb('<span class="lbl">Edit</span>'+segHTML('tool',[['select','Select','Click to select · drag to move · drag the round handles (V)'],['wall','Add wall','Drag from start to end (W)'],['door','Add door','Click on a wall (D)'],['window','Add window','Click on a wall (O)'],['opening','Add opening','Click on a wall']],S.tool)+
      '<span class="vr"></span><button class="btn" id="tDel" title="Delete">Delete</button><button class="btn" id="tUnd" title="Ctrl+Z">Undo</button><button class="btn" id="tRed" title="Ctrl+Y">Redo</button>'+
      '<span class="sp"></span><button class="btn" id="tImg" aria-pressed="'+S.showImg+'">Show image</button>');
    bindSeg('tool',setTool);$('#tDel').onclick=delSel;$('#tUnd').onclick=undoEdit;$('#tRed').onclick=redoEdit;
    $('#tImg').onclick=function(){S.showImg=!S.showImg;this.setAttribute('aria-pressed',S.showImg);draw();};return;}
  if(st==='plan'){tb('<span class="lbl">Result</span><button class="btn primary" id="tRep"'+(S.plan?'':' disabled')+' title="Load the edited result into the editor, replacing its drawing">Load result</button>'+
      '<button class="btn" id="tAdd"'+(S.plan?'':' disabled')+' title="Add the edited result to the drawing open in the editor (current level)">Add to drawing</button>'+
      '<span class="vr"></span><span class="lbl">Drawing</span><input type="text" id="tName" placeholder="Name" value="'+esc(S.projName||stem())+'" style="width:170px" aria-label="Drawing name"><button class="btn" id="tSave">Save</button>'+
      '<select id="tOpenP" aria-label="Open a saved drawing"><option value="">Open saved…</option></select>'+
      '<span class="sp"></span><span class="lbl">Download</span><button class="btn" data-dl="floorplan">floor_plan.json</button><button class="btn" data-dl="dxf">DXF</button><button class="btn" data-dl="svg">SVG</button>');
    $('#tRep').onclick=function(){putInEditor('replace');};$('#tAdd').onclick=function(){putInEditor('add');};
    $('#tName').oninput=function(){S.projName=this.value;};$('#tSave').onclick=saveProject;
    listProjects();$('#tOpenP').onchange=function(){if(this.value)openProject(this.value);this.value='';};
    document.querySelectorAll('[data-dl]').forEach(function(b){b.onclick=function(){download(b.getAttribute('data-dl'));};});return;}
}

function parseLen(t){t=String(t||'').trim().toLowerCase();if(!t)return NaN;var m;

  m=t.match(/^(?:([\d.]+)\s*(?:'|ft)\s*-?\s*)?(?:([\d.]+)(?:\s+(\d+)\/(\d+))?\s*(?:"|in)?)?$/);
  if(m&&(m[1]||m[2])){if(!m[1]&&!/("|in)$/.test(t))return NaN;return ((+(m[1]||0))*12+(+(m[2]||0))+(m[3]?(+m[3])/(+m[4]):0))*25.4;}return NaN;}

function undoEdit(){if(!S.undo.length)return;S.redo.push(JSON.stringify(S.plan));S.plan=JSON.parse(S.undo.pop());S.sel=null;afterEdit();}

  else if(drag.k==='open'){var o=P.openings[drag.i];var near=nearestWall(q,14);if(near&&near.i!==drag.host)drag.host=near.i;var hw=drag.host!=null?P.walls[drag.host]:null;
    if(hw){var ax=hw.end_px[0]-hw.start_px[0],ay=hw.end_px[1]-hw.start_px[1],L2=Math.hypot(ax,ay)||1,ux=ax/L2,uy=ay/L2,half=Math.hypot(drag.b0[0]-drag.a0[0],drag.b0[1]-drag.a0[1])/2,
      t=Math.max(Math.min(half,L2/2),Math.min(L2-Math.min(half,L2/2),(q.x-hw.start_px[0])*ux+(q.y-hw.start_px[1])*uy)),cx=hw.start_px[0]+ux*t,cy=hw.start_px[1]+uy*t;

function stem(){return (S.file&&S.file.name||'plan').replace(/\.[^.]+$/,'');}

    if(k==='dxf')save(stem()+'.dxf',e.dxf,'application/dxf');if(k==='svg')save(stem()+'.svg',e.svg,'image/svg+xml');});}
var ED=null,edReady=Promise.resolve();

// the Floor plan step: show the editor; a new, not yet loaded result goes in automatically when the editor is empty
